[project]
name = "usthing-assessment"
version = "0.1.0"
description = "Customizable timetable service — USThing Backend Technical Test 2026 (Task 1)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bcrypt>=5.0.0",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle errors, I: import sorting
select = ["E", "F", "I"]

[tool.pyright]
# Pin analysis to the project venv so type checking matches runtime.
venvPath = "."
venv = ".venv"
